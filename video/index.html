<meta charset="utf-8">
<title>國際軍事情勢週報影片</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a 16:9 broadcast frame (WebGL + DOM news graphics) above a transport bar for the replay controls. Single dark look by design. */
:root{
  --ink:#04070d; --deck:#0a111c; --line:#1d2b3d; --fg:#e6eef7; --dim:#8da2b8;
  --holo:#3fe0d0; --amber:#ffb23f; --hostile:#ff4b4b; --ally:#5aa8ff;
  --f-hud:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
/* frame-export mode (?capture): stage only, no transitions, so every frame is a pure function of t */
.cap body{padding:0;overflow:hidden} .cap #app{max-width:none;gap:0} .cap #bar,.cap #start{display:none!important} .cap #stage{border:0;width:100vw;aspect-ratio:auto;height:100vh}
.cap *,.cap *::before,.cap *::after{transition:none!important;animation:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#app:fullscreen{max-width:none;padding:0;background:#000;justify-content:center}
#app:fullscreen #stage{width:min(100vw,calc((100vh - 96px)*16/9));margin:0 auto}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;border:1px solid var(--line);container-type:inline-size;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}
/* scanlines + vignette */
#fx{inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65));mix-blend-mode:normal}
#flash{inset:0;background:var(--holo);opacity:0}
#stage.rew #fx{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7));animation:jit .12s steps(2) infinite}
@keyframes jit{50%{transform:translateY(2px)}}
/* HUD bug */
#bug{left:2.2cqw;top:2.4cqw;display:flex;align-items:stretch;gap:0;font-family:var(--f-hud)}
#bug .b1{background:var(--holo);color:#001;font-weight:700;font-size:1.5cqw;padding:.45cqw .9cqw;letter-spacing:.08em}
#bug .b2{background:rgba(4,10,18,.78);border:1px solid rgba(63,224,208,.35);border-left:0;font-size:1.2cqw;padding:.45cqw .9cqw;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
#bug .b2 small{color:var(--dim);font-size:.85cqw;letter-spacing:.12em}
#tc{right:2.2cqw;top:2.4cqw;font-family:var(--f-hud);font-size:1.05cqw;color:var(--dim);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}
#tc b{color:var(--hostile);font-weight:600}
#rate{left:50%;top:2.4cqw;transform:translateX(-50%);font-family:var(--f-hud);font-size:1.6cqw;font-weight:700;letter-spacing:.12em;padding:.35cqw 1.2cqw;border:1px solid var(--amber);color:var(--amber);background:rgba(20,12,0,.7)}
/* chapter card */
#card{inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:8cqw;opacity:0}
#card .num{font-family:var(--f-hud);font-size:11cqw;font-weight:700;color:transparent;-webkit-text-stroke:.18cqw var(--holo);line-height:1;margin-right:2.5cqw}
#card .t{display:flex;flex-direction:column;gap:.6cqw}
#card .k{font-family:var(--f-hud);font-size:1.3cqw;letter-spacing:.35em;color:var(--holo)}
#card .h{font-size:4.6cqw;font-weight:900;letter-spacing:.06em;text-shadow:0 0 2cqw rgba(63,224,208,.35)}
#card .bar{height:.3cqw;background:linear-gradient(90deg,var(--holo),transparent);transform-origin:left}
/* title (intro/outro) */
#title{inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:7cqw;gap:1cqw;opacity:0}
#title .k{font-family:var(--f-hud);letter-spacing:.4em;color:var(--holo);font-size:1.3cqw}
#title .h{font-size:5.6cqw;font-weight:900;letter-spacing:.08em;line-height:1.1;text-shadow:0 0 3cqw rgba(63,224,208,.4)}
#title .s{font-family:var(--f-hud);font-size:1.6cqw;color:var(--dim);letter-spacing:.2em}
#title .r{font-family:var(--f-hud);font-size:1.3cqw;color:var(--amber);border:1px solid var(--amber);padding:.3cqw .8cqw;letter-spacing:.15em}
/* lower third */
#lower{left:2.2cqw;bottom:13.2cqw;display:flex;flex-direction:column;align-items:flex-start;gap:.3cqw;opacity:0}
#lower .k{background:var(--hostile);color:#fff;font-family:var(--f-hud);font-weight:700;font-size:1.05cqw;letter-spacing:.18em;padding:.2cqw .7cqw}
#lower .h{background:rgba(4,10,18,.86);border-left:.35cqw solid var(--holo);font-size:2.2cqw;font-weight:700;padding:.4cqw 1.2cqw .5cqw;letter-spacing:.04em}
/* right panel */
#panel{right:2.2cqw;top:8.5cqw;width:29cqw;display:flex;flex-direction:column;gap:.7cqw;opacity:0}
#panel .ph{font-family:var(--f-hud);font-size:1cqw;letter-spacing:.25em;color:var(--holo);border-bottom:1px solid rgba(63,224,208,.4);padding-bottom:.4cqw;display:flex;justify-content:space-between}
#panel .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6cqw}
#panel .st{background:rgba(4,10,18,.78);border:1px solid rgba(63,224,208,.25);padding:.6cqw .8cqw;opacity:.12;transition:opacity .35s}
#panel .st.on{opacity:1}
#panel .st b{display:block;font-family:var(--f-hud);font-size:2.3cqw;font-weight:700;color:var(--amber);line-height:1.1;font-variant-numeric:tabular-nums}
#panel .st span{font-size:.95cqw;color:var(--dim)}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5cqw}
#panel li{background:rgba(4,10,18,.8);border-left:.25cqw solid var(--ally);padding:.5cqw .8cqw;font-size:1.18cqw;line-height:1.45;opacity:0;transform:translateX(2cqw);transition:opacity .35s,transform .35s}
#panel li.on{opacity:1;transform:none}
#panel li.h{border-left-color:var(--hostile)} #panel li.a{border-left-color:var(--amber)}
#spec{right:2.2cqw;top:8.5cqw;width:29cqw;font-family:var(--f-hud)}
/* subtitles */
#sub{left:50%;bottom:6.1cqw;transform:translateX(-50%);max-width:72cqw;text-align:center}
#sub span{display:inline;background:rgba(0,0,0,.72);font-size:2.15cqw;font-weight:500;line-height:1.55;padding:.15cqw .7cqw;box-decoration-break:clone;-webkit-box-decoration-break:clone;letter-spacing:.03em}
#stage.nocc #sub{display:none}
/* ticker */
#ticker{left:0;right:0;bottom:0;height:3.6cqw;display:flex;align-items:center;background:rgba(3,8,15,.92);border-top:1px solid rgba(63,224,208,.35);overflow:hidden}
#ticker .lab{flex:none;height:100%;display:flex;align-items:center;padding:0 1.2cqw;background:var(--hostile);font-family:var(--f-hud);font-weight:700;font-size:1.15cqw;letter-spacing:.15em;z-index:1}
#ticker .crawl{white-space:nowrap;font-size:1.3cqw;will-change:transform;padding-left:2cqw}
#ticker .crawl i{color:var(--amber);font-style:normal;margin:0 1.4cqw}
#labels{inset:0}
.mk{position:absolute;transform:translate(-50%,-130%);font-size:1.05cqw;font-weight:700;white-space:nowrap;padding:.15cqw .5cqw;background:rgba(3,8,15,.78);border:1px solid currentColor;letter-spacing:.03em;transition:opacity .25s}
.mk::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:1.1cqw;background:currentColor}
#src{right:2.2cqw;bottom:4.2cqw;font-size:.85cqw;color:var(--dim);font-family:var(--f-hud)}
/* start */
#start{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;background:rgba(0,0,0,.55);pointer-events:auto}
#start button{font:700 1.8cqw var(--f-body);color:#001;background:var(--holo);border:0;padding:1cqw 2.6cqw;cursor:pointer;letter-spacing:.1em}
#start button:disabled{background:var(--line);color:var(--dim);cursor:progress}
#start p{margin:0;color:var(--dim);font-size:1.2cqw}
/* transport */
#bar{display:flex;flex-direction:column;gap:8px;background:var(--deck);border:1px solid var(--line);padding:10px 12px}
#tl{position:relative;height:30px;cursor:pointer;touch-action:none}
#tl .trk{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--line)}
#tl .fill{position:absolute;left:0;top:13px;height:4px;background:var(--holo)}
#tl .head{position:absolute;top:7px;width:4px;height:16px;background:#fff;transform:translateX(-2px)}
#tl .ch{position:absolute;top:0;height:30px;border-left:1px solid var(--dim);font:10px var(--f-hud);color:var(--dim);padding-left:3px;white-space:nowrap;overflow:hidden}
#tl .hov{position:absolute;bottom:32px;transform:translateX(-50%);font:12px var(--f-hud);background:#000;border:1px solid var(--line);padding:2px 6px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.row button,.row select{font:600 13px var(--f-hud);color:var(--fg);background:#0f1928;border:1px solid var(--line);padding:6px 10px;cursor:pointer;min-width:38px}
.row button:hover{border-color:var(--holo)}
.row button:focus-visible,.row input:focus-visible,#tl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row button.on{background:var(--holo);color:#001;border-color:var(--holo)}
.row .sp{display:flex;gap:2px;flex-wrap:wrap}
.row .sp button{min-width:0;padding:6px 7px}
.row .sp button.neg{color:var(--amber)}
.row .sp button.on.neg{background:var(--amber);color:#100}
#time{font:600 13px var(--f-hud);font-variant-numeric:tabular-nums;color:var(--dim);margin-left:auto}
.row label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px}
.row input[type=range]{width:90px;accent-color:var(--holo)}
#keys{font-size:12px;color:var(--dim);line-height:1.6}
#keys kbd{font:11px var(--f-hud);border:1px solid var(--line);padding:0 4px;color:var(--fg)}
@media (max-width:640px){#time{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){#stage.rew #fx{animation:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="labels" class="ov"></div>
    <div id="fx" class="ov"></div>
    <div id="title" class="ov"><div class="k">WEEKLY DEFENSE INTELLIGENCE BRIEF</div><div class="h" id="ttlH"></div><div class="s" id="ttlS"></div><div class="r" id="ttlR"></div></div>
    <div id="card" class="ov"><div class="num" id="cNum"></div><div class="t"><div class="k" id="cK"></div><div class="h" id="cH"></div><div class="bar" id="cBar"></div></div></div>
    <div id="bug" class="ov"><div class="b1">WDIB</div><div class="b2"><span>國際軍事情勢週報</span><small id="bugR"></small></div></div>
    <div id="tc" class="ov"></div>
    <div id="rate" class="ov" hidden></div>
    <div id="lower" class="ov"><div class="k" id="lK"></div><div class="h" id="lH"></div></div>
    <div id="panel" class="ov"><div class="ph"><span id="pK"></span><span id="pN"></span></div><div class="stats" id="pS"></div><ul id="pB"></ul></div>
    <div id="src" class="ov"></div>
    <div id="sub" class="ov"><span id="subT"></span></div>
    <div id="ticker" class="ov"><div class="lab">快訊</div><div class="crawl" id="crawl"></div></div>
    <div id="flash" class="ov"></div>
    <div id="start" class="ov"><button id="go" disabled>載入中…</button><p id="loadMsg">正在準備配音與音效</p></div>
  </div>
  <div id="bar">
    <div id="tl" tabindex="0" role="slider" aria-label="播放進度"><div class="trk"></div><div class="fill" id="fill"></div><div class="head" id="head"></div><div class="hov" id="hov" hidden></div></div>
    <div class="row">
      <button id="bPrev" title="上一章 (Shift+←)">⏮</button>
      <button id="bBack" title="倒退 5 秒 (←)">-5s</button>
      <button id="bFrB" title="上一格 (,)">‹</button>
      <button id="bPlay" title="播放／暫停 (空白鍵、K)">▶</button>
      <button id="bFrF" title="下一格 (.)">›</button>
      <button id="bFwd" title="前進 5 秒 (→)">+5s</button>
      <button id="bNext" title="下一章 (Shift+→)">⏭</button>
      <div class="sp" id="speeds" role="group" aria-label="播放速度"></div>
      <span id="time">00:00 / 00:00</span>
    </div>
    <div class="row">
      <button id="bCC" class="on" title="字幕 (C)">字幕</button>
      <label for="vol">音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.9"></label>
      <button id="bMute" title="靜音 (M)">靜音</button>
      <button id="bFull" title="全螢幕 (F)">全螢幕</button>
    </div>
    <div id="keys"><kbd>J</kbd> 倒轉（連按加速）　<kbd>K</kbd> 暫停　<kbd>L</kbd> 正轉（連按加速）　<kbd>S</kbd> 慢放 0.25×　<kbd>R</kbd> 正／倒反轉　<kbd>,</kbd><kbd>.</kbd> 逐格　拖曳進度條可即時預覽</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="geo.js" charset="utf-8"></script>
<script src="content.js" charset="utf-8"></script>
<script src="audio.js" charset="utf-8"></script>
<script>
(() => {
'use strict';
const C = window.CONTENT, A = window.AUDIO, G = window.GEO;
if (/capture/.test(location.search)) document.documentElement.classList.add('cap');
const $ = (id) => document.getElementById(id);
const D2R = Math.PI / 180, V3 = THREE.Vector3;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, d) => clamp((t - a) / d);
const fract = (x) => x - Math.floor(x);
function ll(lat, lon, r = 1) { const p = (90 - lat) * D2R, th = (lon + 180) * D2R; return new V3(-r * Math.sin(p) * Math.cos(th), r * Math.cos(p), r * Math.sin(p) * Math.sin(th)); }
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const COL = { hostile: 0xff4b4b, ally: 0x5aa8ff, alert: 0xffb23f, info: 0xdfe8f2, holo: 0x3fe0d0 };
const CSSCOL = { hostile: '#ff4b4b', ally: '#5aa8ff', alert: '#ffb23f', info: '#dfe8f2', holo: '#3fe0d0' };

/* ---------------- timeline ---------------- */
const DUR = A.durs; // seconds per clip id
const GAP = 0.28;
let T_TOTAL = 0;
const segs = C.segments;
(function build() {
  let T = 0;
  segs.forEach((s, i) => {
    s.i = i; s.t0 = T;
    const padIn = s.chapter ? 2.6 : (s.mode === 'intro' ? 4.2 : 1.0);
    T += padIn;
    s.lines.forEach((l) => { l.t0 = T; l.dur = DUR[l.id] || Math.max(1.6, l.text.length * 0.2); T += l.dur + GAP; });
    T += s.mode === 'outro' ? 3.5 : 0.35;
    s.t1 = T;
  });
  T_TOTAL = T;
})();
const lineAt = (s, idx) => (s.lines[Math.min(idx || 0, s.lines.length - 1)] || { t0: s.t0 }).t0;
function segAt(t) { for (let i = segs.length - 1; i >= 0; i--) if (t >= segs[i].t0) return segs[i]; return segs[0]; }
const fmt = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); };

/* ---------------- renderer ---------------- */
const canvas = $('gl'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
scene.fog = null;
const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.01, 200);
scene.add(camera);
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1280, 720), 0.85, 0.5, 0.12);
composer.addPass(bloom);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h;
  camera.setViewOffset(w, h, w * 0.1, 0, w, h); // push globe left of centre, panel lives on the right
  camera.updateProjectionMatrix();
  uni.uPix.value = h * renderer.getPixelRatio() * 0.0017; uni.uPixH.value = h * renderer.getPixelRatio() * 0.16;
}
new ResizeObserver(resize).observe(stage);

/* ---------------- globe ---------------- */
const globe = new THREE.Group(); scene.add(globe);
const uni = { uT: { value: 0 }, uAssemble: { value: 1 }, uPix: { value: 1.3 }, uPixH: { value: 130 }, uDim: { value: 1 } };

const ocean = new THREE.Mesh(new THREE.SphereGeometry(0.995, 96, 64), new THREE.ShaderMaterial({
  uniforms: { uDim: uni.uDim },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 w=modelMatrix*vec4(position,1.); vN=normalize(mat3(modelMatrix)*normal); vV=normalize(cameraPosition-w.xyz); gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uDim; varying vec3 vN; varying vec3 vV; void main(){ float f=pow(1.-max(dot(vN,vV),0.),3.); vec3 c=mix(vec3(.008,.02,.04),vec3(.05,.35,.4),f); gl_FragColor=vec4(c*uDim,1.); }`
}));
globe.add(ocean);

const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.17, 64, 48), new THREE.ShaderMaterial({
  uniforms: { uDim: uni.uDim }, side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vP=mv.xyz; gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `uniform float uDim; varying vec3 vN; varying vec3 vP; void main(){ float i=pow(clamp(.62+dot(vN,normalize(vP)),0.,1.),3.2); gl_FragColor=vec4(vec3(.12,.75,.8)*i*1.4*uDim,i); }`
}));
globe.add(atmo);

// land dots (assemble from a particle cloud during the intro)
(function () {
  const n = G.land.length / 2, pos = new Float32Array(n * 3), rnd = new Float32Array(n * 3), seed = new Float32Array(n);
  const R = rng(7);
  for (let i = 0; i < n; i++) {
    const v = ll(G.land[i * 2 + 1], G.land[i * 2], 1.003); pos.set([v.x, v.y, v.z], i * 3);
    const d = new V3(R() - .5, R() - .5, R() - .5).normalize().multiplyScalar(3 + R() * 9); rnd.set([d.x, d.y, d.z], i * 3); seed[i] = R();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('rnd', new THREE.BufferAttribute(rnd, 3)); g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: uni, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute vec3 rnd; attribute float seed; uniform float uT,uAssemble,uPix,uDim; varying float vA;
      void main(){ float k=clamp(uAssemble*1.35-seed*.35,0.,1.); k=k*k*(3.-2.*k); vec3 p=mix(rnd,position,k);
        vec4 w=modelMatrix*vec4(p,1.); vec4 mv=viewMatrix*w; gl_Position=projectionMatrix*mv;
        float tw=.65+.35*sin(uT*1.7+seed*60.);
